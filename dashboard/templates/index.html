<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scanner Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>UR5 Photogrammetry</h1>
            <p>3D Scanner Auto-scan with NodeODM</p>
        </header>

        <main class="dashboard">
            <section class="video-section card">
                <h2>Live Camera</h2>
                <div class="camera-controls">
                    <label for="camera-select">Pilih Kamera: </label>
                    <select id="camera-select">
                        <option value="0">Loading...</option>
                    </select>
                </div>
                <div class="video-container">
                    <img src="/video_feed" alt="Live Camera" id="camera-stream">
                </div>
            </section>

            <section class="control-section card">
                <h2>Controls</h2>
                <div class="button-group">
                    <button id="btn-capture" class="btn primary glow">Mulai Capture (12 Posisi)</button>
                    <button id="btn-process" class="btn secondary">Proses 3D Model</button>
                </div>
                
                <div class="log-terminal">
                    <h3>System Logs</h3>
                    <div id="log-output"></div>
                </div>
            </section>
        </main>

        <section class="dataset-section card mt-2">
            <div class="section-header">
                <h2>Galeri Dataset</h2>
                <button id="btn-refresh-dataset" class="btn small">Refresh</button>
            </div>
            <div class="grid-gallery" id="dataset-gallery">
                <!-- Images injected here -->
            </div>
        </section>

        <section class="viewer-section card mt-2">
            <h2>3D Model Viewer & Hasil</h2>
            <div class="dashboard">
                <div class="three-container" id="three-container">
                    <div class="overlay-text" id="viewer-status">Menunggu data model (.obj) di folder output ...</div>
                </div>
                <div class="results-list">
                    <h3>File Hasil (Download)</h3>
                    <button id="btn-refresh-results" class="btn small mb-1">Refresh List</button>
                    <ul id="results-ul">
                        <!-- Links injected here -->
                    </ul>
                </div>
            </div>
        </section>
    </div>
    <script type="module" src="/static/script.js"></script>
</body>
</html>
